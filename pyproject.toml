[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conversor-fcf"
# Single version authority is conversor_fcf.__version__, resolved below by
# [tool.setuptools.dynamic]; RunManifest.tool_version cannot drift from the
# installed distribution version.
dynamic = ["version"]
description = "Converts a Cobre case (JSON inputs plus FlatBuffers policy checkpoint) into DECOMP-format mapcut and cortdeco files."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "carlosribeiro06", email = "carlosribeiro121201@gmail.com" }]
# Deliberately excludes pyarrow and polars: the converter never reads Cobre Parquet
# artifacts (see master plan Key Design Decision 5). Do not reintroduce them here.
dependencies = [
    "flatbuffers>=25.12",
    "numpy>=2.5",
    "pandas>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# idecomp is a test-only read-back oracle; it must never be a runtime dependency.
test = [
    "idecomp>=1.14.2",
    "pytest>=8.0",
    "pytest-cov>=5",
]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
conversor-fcf = "conversor_fcf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "conversor_fcf.__version__" }

[tool.setuptools.package-data]
conversor_fcf = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated FlatBuffers readers are vendored verbatim and must never be edited to
# satisfy a linter. Both paths are listed so the exclusion survives ticket-003's
# relocation of the tree under src/.
extend-exclude = ["Cobre", "src/Cobre"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = "^(src/)?Cobre/"

[tool.pytest.ini_options]
testpaths = ["tests"]
